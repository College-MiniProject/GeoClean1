<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboard | GeoClean</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/leaderboard.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-left">
        <button class="hamburger-menu">☰</button>
        <div class="logo">
          <a href="index.html" style="text-decoration: none; color: white">
            Geo<span class="highlight">Clean</span> 🌍
          </a>
        </div>
      </div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="leaderboard.html" class="active">Leaderboard</a>
        <a href="missions.html">Missions</a>
        <a href="#" id="dashboard-link">Dashboard</a>
      </div>
      <div id="auth-container"></div>
    </nav>

    <section id="leaderboard" class="leaderboard-section">
      <div class="leaderboard-container">
        <div class="leaderboard-header">
          <h2>🏆 Top Scavengers</h2>
          <p>Compete, Clean, Conquer.</p>
        </div>

        <div class="leaderboard-list" id="leaderboard-list">
          <p style="text-align: center;">Loading leaderboard...</p>
        </div>
      </div>
    </section>

    <script src="js/notifications.js"></script>
    <script>
      const dashboardLink = document.getElementById("dashboard-link");
      const user = localStorage.getItem("user") || sessionStorage.getItem("user");

      dashboardLink.addEventListener("click", function (e) {
        if (!user) {
          e.preventDefault();
          alert("Please login to access dashboard");
          window.location.href = "auth.html";
        } else {
          window.location.href = "Dashboard.html";
        }
      });

      const API_URL = window.location.origin;

      async function loadLeaderboard() {
        const list = document.getElementById('leaderboard-list');
        try {
          const res = await fetch(`${API_URL}/leaderboard`);
          const data = await res.json();
          const users = data.leaderboard || [];

          list.innerHTML = "";
          if (users.length === 0) {
            list.innerHTML = "<p style='text-align:center;'>No data available</p>";
            return;
          }

          users.forEach((u, index) => {
            const rank = index + 1;
            let rankClass = "";
            let rankMedal = "";
            
            if (rank === 1) { rankClass = "top-rank gold"; rankMedal = "🏆"; }
            else if (rank === 2) { rankClass = "top-rank silver"; rankMedal = "🥈"; }
            else if (rank === 3) { rankClass = "top-rank bronze"; rankMedal = "🥉"; }

            const card = document.createElement('div');
            card.className = `leaderboard-card ${rankClass}`;
            card.innerHTML = `
              <div class="rank-badge">${rank}</div>
              <div class="user-info">
                <h3 class="user-name">${u.full_name} ${rankMedal}</h3>
                <span class="user-dept">${u.department || 'Unknown'} Dept</span>
              </div>
              <div class="user-points">${u.geocoins || 0} <span>pts</span></div>
            `;
            list.appendChild(card);
          });
        } catch (err) {
          list.innerHTML = "<p style='text-align:center;'>Error loading leaderboard</p>";
        }
      }

      loadLeaderboard();
    </script>
    <script src="js/nav.js"></script>
  </body>
</html>
