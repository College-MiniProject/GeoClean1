<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Active Missions | GeoClean</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/missions.css" />
    
    <style>
      /* Modal styles for Mission Details */
      .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); z-index: 2000;
        display: none; justify-content: center; align-items: center;
      }
      .modal-card {
        background: var(--card-bg);
        border: 1px solid rgba(16, 185, 129, 0.2);
        border-radius: 12px;
        width: 90%; max-width: 500px;
        padding: 20px;
        position: relative;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-close {
        position: absolute; top: 10px; right: 15px; color: #fff; cursor: pointer; font-size: 1.5rem;
        background: rgba(0,0,0,0.8); border-radius: 50%; width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; z-index: 10;
      }
      .modal-img {
        width: 100%; border-radius: 8px; margin-bottom: 15px; max-height: 300px; object-fit: cover; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-left">
        <button class="hamburger-menu">☰</button>
        <div class="logo">
          <a href="index.html" style="text-decoration: none; color: white">
            Geo<span class="highlight">Clean</span> 🌍
          </a>
        </div>
      </div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="missions.html" class="active">Missions</a>
        <a href="#" id="dashboard-link">Dashboard</a>
      </div>
      <div id="auth-container"></div>
    </nav>

    <section class="missions-header-section">
      <div class="container text-center">
        <h1 class="page-title">
          Active <span class="gradient-text">Missions</span>
        </h1>
        <p class="page-subtitle">
          Accept a challenge, clean the location, upload proof, and earn your
          GeoCoins.
        </p>

        <div class="mission-filters">
          <button class="filter-btn active" id="btn-tab-all" onclick="setTab('all')">All</button>
          <button class="filter-btn" id="btn-tab-available" onclick="setTab('available')">Available</button>
          <button class="filter-btn" id="btn-tab-my" onclick="setTab('my')">My Accepted</button>
        </div>
      </div>
    </section>

    <section class="missions-content">
      <div class="container">
        <div class="missions-grid" id="missions-grid">
          <p style="text-align: center; width: 100%;">Loading missions...</p>
        </div>
      </div>
    </section>

    <!-- Mission Detail Modal -->
    <div class="modal-overlay" id="mission-modal">
      <div class="modal-card">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <img id="modal-img" class="modal-img" src="" alt="Mission Evidence" onclick="if(window.openZoom) window.openZoom(this.src);">
        <h3 id="modal-title">Mission Type</h3>
        <p id="modal-location" style="color: var(--primary-green); font-size: 0.9rem;">📍 Location</p>
        <p id="modal-desc" style="color: var(--text-gray); margin: 10px 0;">Description goes here.</p>
        
        <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; font-size: 0.85rem; text-align: left; line-height: 1.5; margin-bottom: 10px;">
           <p style="margin: 5px 0; display:flex;"><strong>🗣️ Full Address:</strong> <span style="margin-left: 5px;" id="modal-full-address"></span></p>
           <p style="margin: 5px 0; display:flex;"><strong>📅 Scheduled:</strong> <span style="margin-left: 5px;" id="modal-schedule"></span></p>
           <p style="margin: 5px 0; display:flex;"><strong>🛠️ Equipment:</strong> <span style="margin-left: 5px;" id="modal-equipment"></span></p>
           <p style="margin: 5px 0; display:flex;"><strong>👥 Workers Req:</strong> <span style="margin-left: 5px;" id="modal-people"></span></p>
           <div id="modal-slots-bar" style="margin: 8px 0;">
             <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px;">
               <span id="modal-slots-text" style="color: var(--neon-green);"></span>
             </div>
             <div style="background: rgba(255,255,255,0.1); border-radius: 4px; height: 8px; overflow: hidden;">
               <div id="modal-slots-fill" style="height: 100%; background: var(--neon-green); border-radius: 4px; transition: width 0.3s;"></div>
             </div>
           </div>
        </div>
        
        <div style="display: flex; justify-content: space-between; margin-top: 10px;">
          <span style="font-weight: bold; color: var(--neon-green)">🏆 <span id="modal-reward"></span> GeoCoins</span>
        </div>
        
        <button id="modal-accept-btn" class="btn-mission w-100" style="margin-top: 15px;">Confirm Accept</button>
      </div>
    </div>

    <script src="js/notifications.js"></script>
    <script>
      const user = localStorage.getItem("user") || sessionStorage.getItem("user");
      const dashboardLink = document.getElementById("dashboard-link");
      const grid = document.getElementById("missions-grid");
      const modal = document.getElementById("mission-modal");
      let allMissions = [];

      dashboardLink.addEventListener("click", function (e) {
        if (!user) {
          e.preventDefault();
          alert("Please login to access dashboard");
          window.location.href = "auth.html";
        } else {
          window.location.href = "Dashboard.html";
        }
      });

      const API_URL = window.location.origin;

      async function loadMissions() {
        try {
          const res = await fetch(`${API_URL}/missions`);
          const data = await res.json();
          // Only show admin-approved missions (or ones user has already accepted)
          allMissions = (data.missions || []).filter(m => {
            if (m.verification_status === 'verified') return true;
            // Also show pending_completion missions where user is a participant
            if (m.status === 'pending_completion') {
              const list = m.accepted_by_list || [];
              if (list.includes(user)) return true;
            }
            // Also show unverified missions where user is in accepted list (edge case)
            const list = m.accepted_by_list || [];
            if (list.includes(user)) return true;
            return false;
          });
          applyFilters();
        } catch(err) {
          grid.innerHTML = "<p>Error loading missions from server.</p>";
        }
      }

      let currentTab = 'all';

      function setTab(tab) {
         currentTab = tab;
         document.getElementById('btn-tab-all').classList.remove('active');
         document.getElementById('btn-tab-available').classList.remove('active');
         document.getElementById('btn-tab-my').classList.remove('active');
         document.getElementById('btn-tab-'+tab).classList.add('active');
         applyFilters();
      }

      function applyFilters() {
         if (!allMissions) return;
         let filtered = [];
         if (currentTab === 'all') {
             // Show all missions (user can still see ones they've joined)
             filtered = allMissions.filter(m => m.status !== 'completed');
         } else if (currentTab === 'available') {
             // Missions with open slots that user hasn't accepted
             filtered = allMissions.filter(m => {
               const list = m.accepted_by_list || [];
               const slotsAvailable = (m.people_needed || 1) - (m.slots_taken || 0);
               return m.status !== 'completed' && m.status !== 'pending_completion' && !list.includes(user) && slotsAvailable > 0;
             });
         } else if (currentTab === 'my') {
             if(!user) { alert("Login to see your accepted missions"); return; }
             filtered = allMissions.filter(m => (m.accepted_by_list || []).includes(user));
         }
         renderMissions(filtered);
      }

      function renderMissions(missionsSource) {
        grid.innerHTML = "";
        if (missionsSource.length === 0) {
          grid.innerHTML = '<p style="text-align: center; width: 100%;">No missions found.</p>';
          return;
        }

        missionsSource.forEach(m => {
          if (m.status === 'completed') return;

          const card = document.createElement('div');
          card.className = "mission-card";
          
          let imgUrl = m.before_image ? `${API_URL}/uploads/${m.before_image}` : '';
          let bgStyle = imgUrl ? `background-image: url('${imgUrl}'); background-size: cover; background-position: center;` : 'background: linear-gradient(135deg, #10b981, #0ea5e9);';

          const peopleNeeded = m.people_needed || 1;
          const slotsTaken = m.slots_taken || 0;
          const slotsAvailable = peopleNeeded - slotsTaken;
          const acceptedList = m.accepted_by_list || [];
          const userAccepted = acceptedList.includes(user);

          let buttonHtml = '';
          let slotHtml = '';

          if (peopleNeeded > 1) {
            const pct = Math.round((slotsTaken / peopleNeeded) * 100);
            slotHtml = `
              <div style="margin: 6px 0; font-size: 0.75rem;">
                <div style="display:flex; justify-content:space-between; margin-bottom: 3px;">
                  <span>👥 ${slotsTaken}/${peopleNeeded} joined</span>
                  <span style="color: var(--neon-green);">${slotsAvailable} slot${slotsAvailable !== 1 ? 's' : ''} open</span>
                </div>
                <div style="background: rgba(255,255,255,0.1); border-radius: 4px; height: 6px; overflow: hidden;">
                  <div style="width: ${pct}%; height: 100%; background: var(--neon-green); border-radius: 4px;"></div>
                </div>
              </div>
            `;
          }

          if (m.status === 'completed') {
            buttonHtml = `<button class="btn-mission w-100" disabled style="background:#555; cursor:not-allowed;">Completed</button>`;
          } else if (m.status === 'pending_completion' && userAccepted) {
            buttonHtml = `<button class="btn-mission w-100" disabled style="background: rgba(139,92,246,0.3); border: 1px solid rgba(139,92,246,0.5); cursor:not-allowed; color:#a78bfa;">⏳ Pending Admin Review</button>`;
          } else if (m.completion_status === 'rejected' && userAccepted) {
            buttonHtml = `<button class="btn-mission w-100" style="background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.4); color:#f87171;" onclick="window.location.href='complete.html?id=${m.id}'">❌ Rejected — Resubmit Proof</button>`;
          } else if (userAccepted) {
            buttonHtml = `<button class="btn-mission w-100" style="background:var(--neon-green); color:#000;" onclick="window.location.href='complete.html?id=${m.id}'">Complete Mission</button>`;
          } else if (slotsAvailable > 0) {
            buttonHtml = `<button class="btn-mission w-100" onclick="viewMission(${m.id})">View & Accept</button>`;
          } else {
            buttonHtml = `<button class="btn-mission w-100" disabled style="background:#555; cursor:not-allowed;">All Slots Taken</button>`;
          }

          card.innerHTML = `
            <div class="mission-image" style="${bgStyle}"></div>
            <div class="mission-body">
              <h3>${m.type}</h3>
              <p class="mission-location" style="font-size:0.8rem; height: 35px; overflow:hidden;">📍 ${m.location_text || 'GPS Location'}</p>
              ${slotHtml}
              <div class="mission-stats" style="margin-top: 6px;">
                <div class="stat"><span class="icon">🏆</span> ${m.reward} GeoCoins</div>
              </div>
              ${buttonHtml}
            </div>
          `;
          grid.appendChild(card);
        });
      }

      function viewMission(id) {
        if (!user) {
          window.location.href = "auth.html";
          return;
        }
        
        const m = allMissions.find(x => x.id === id);
        if(!m) return;

        const peopleNeeded = m.people_needed || 1;
        const slotsTaken = m.slots_taken || 0;
        const slotsAvailable = peopleNeeded - slotsTaken;
        const acceptedList = m.accepted_by_list || [];
        const userAccepted = acceptedList.includes(user);

        document.getElementById('modal-title').innerText = m.type;
        document.getElementById('modal-location').innerText = `📍 ${m.location_text || 'Coordinates: ' + m.latitude + ',' + m.longitude}`;
        document.getElementById('modal-full-address').innerText = m.full_address || m.location_text || 'Coordinates: ' + m.latitude + ',' + m.longitude;
        document.getElementById('modal-schedule').innerText = (m.scheduled_date && m.scheduled_time) ? `${m.scheduled_date} at ${m.scheduled_time}` : 'TBD';
        document.getElementById('modal-equipment').innerText = m.equipment_needed || 'General Cleanup Tooling';
        document.getElementById('modal-people').innerText = `${peopleNeeded} Person(s)`;
        document.getElementById('modal-desc').innerText = m.description || 'No additional description provided.';
        document.getElementById('modal-reward').innerText = m.reward;

        // Slots progress bar
        const pct = Math.round((slotsTaken / peopleNeeded) * 100);
        document.getElementById('modal-slots-text').innerText = `${slotsTaken} of ${peopleNeeded} slots taken — ${slotsAvailable} available`;
        document.getElementById('modal-slots-fill').style.width = pct + '%';
        
        const img = document.getElementById('modal-img');
        img.src = m.before_image ? `${API_URL}/uploads/${m.before_image}` : '';
        
        const acceptBtn = document.getElementById('modal-accept-btn');
        if (userAccepted) {
          acceptBtn.innerText = '✅ Already Accepted — Complete Mission';
          acceptBtn.onclick = function() { window.location.href = 'complete.html?id=' + id; };
        } else if (slotsAvailable > 0) {
          acceptBtn.innerText = `Accept Slot (${slotsAvailable} remaining)`;
          acceptBtn.disabled = false;
          acceptBtn.onclick = function() { confirmAccept(id); };
        } else {
          acceptBtn.innerText = 'All Slots Taken';
          acceptBtn.disabled = true;
        }
        
        modal.style.display = 'flex';
      }

      function closeModal() {
        modal.style.display = 'none';
      }

      async function confirmAccept(id) {
        const acceptBtn = document.getElementById('modal-accept-btn');
        acceptBtn.innerText = "Accepting...";
        acceptBtn.disabled = true;

        try {
           const res = await fetch(`${API_URL}/missions/${id}/accept`, {
             method: "POST",
             headers: {"Content-Type": "application/json"},
             body: JSON.stringify({ email: user })
           });
           const data = await res.json();
           if(res.ok) {
             alert("Mission Accepted! You can now navigate to complete it.");
             closeModal();
             loadMissions(); // reload grid
           } else {
             alert(data.error);
             closeModal();
             loadMissions();
           }
        } catch(e) {
          alert("Network error.");
          closeModal();
        }
      }

      // Init
      loadMissions();
    </script>
    <script src="js/nav.js"></script>
  </body>
</html>
