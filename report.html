<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report Garbage | GeoClean</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    
    <style>
      .report-container {
        padding: 100px 20px 40px;
        max-width: 600px;
        margin: auto;
      }
      .page-title { margin-bottom: 20px; text-align: center; }
      
      .camera-box {
        position: relative;
        width: 100%;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
        aspect-ratio: 4/3;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin-bottom: 20px;
      }
      video { width: 100%; height: 100%; object-fit: cover; }
      canvas { display: none; }
      #photo-result { display: none; width: 100%; object-fit: cover; }
      
      .overlay-info {
        position: absolute;
        bottom: 10px;
        left: 10px;
        color: #fff;
        background: rgba(0,0,0,0.6);
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 0.8rem;
        pointer-events: none;
      }

      .btn-camera {
        margin: 10px;
        padding: 10px 20px;
        background: var(--primary-green);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 1rem;
      }

      .camera-controls { text-align: center; }

      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; color: var(--text-gray);
      }
      .form-group select, .form-group input, .form-group textarea {
        width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.05); color: #fff;
      }
      
      .submit-btn { width: 100%; padding: 15px; background: var(--neon-green); color: #000; border: none; font-weight: 700; border-radius: 8px; cursor: pointer; margin-top: 10px; }
      .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-left">
        <button class="hamburger-menu">☰</button>
        <div class="logo">
          <a href="index.html" style="text-decoration: none; color: white">
            Geo<span class="highlight">Clean</span> 🌍
          </a>
        </div>
      </div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="missions.html">Missions</a>
        <a href="Dashboard.html">Dashboard</a>
      </div>
      <div id="auth-container"></div>
    </nav>

    <div class="report-container">
      <h1 class="page-title">Report <span class="gradient-text">Garbage</span></h1>
      
      <div class="camera-box" id="camera-box">
        <video id="video" autoplay playsinline></video>
        <img id="photo-result" alt="Captured Photo" />
        <div class="overlay-info" id="overlay-info">Location fetching...</div>
      </div>

      <canvas id="canvas"></canvas>

      <div class="camera-controls">
        <button type="button" class="btn-camera" id="btn-start-cam">Open Camera</button>
        <button type="button" class="btn-camera" id="btn-capture" style="display:none;">Capture Photo</button>
        <button type="button" class="btn-camera" id="btn-retake" style="display:none;">Retake</button>
      </div>

      <form id="report-form" style="margin-top: 20px;">
        <div class="form-group">
          <label>Garbage Type</label>
          <select id="type" required>
            <option value="" disabled selected>Select type...</option>
            <option value="Street Garbage">Street Garbage</option>
            <option value="Overflowing Dustbin">Overflowing Dustbin</option>
            <option value="Plastic Waste Area">Plastic Waste Area</option>
            <option value="Construction Waste">Construction Waste</option>
          </select>
        </div>
        <div class="form-group">
          <label>Description (Optional)</label>
          <textarea id="description" rows="3" placeholder="Additional details..."></textarea>
        </div>
        <div class="form-group">
          <label>Equipment Needed</label>
          <select id="equipment_needed" required>
            <option value="" disabled selected>Select required equipment...</option>
            <option value="Broom & Dustpan">Broom & Dustpan</option>
            <option value="Heavy Duty Trash Bags">Heavy Duty Trash Bags</option>
            <option value="Shovel & Wheelbarrow">Shovel & Wheelbarrow</option>
            <option value="Thick Protective Gloves">Thick Protective Gloves</option>
            <option value="None / General Pickup">None / General Pickup</option>
          </select>
        </div>
        <div class="form-group">
          <label>Location Info (Auto-generated)</label>
          <input type="text" id="location_text" readonly placeholder="Waiting for GPS..." />
        </div>

        <div class="form-group">
          <label>👥 Workers Needed (AI-estimated, you can adjust)</label>
          <input type="number" id="people_needed" min="1" max="10" value="2" style="text-align: center; font-size: 1.1rem; font-weight: 700;" />
          <p style="font-size: 0.75rem; color: var(--text-gray); margin-top: 4px;">Min: 1, Max: 10 — More workers = higher reward</p>
        </div>

        <div id="ai-preview" style="display:none; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); border-radius: 8px; padding: 12px; margin-bottom: 15px;">
          <p style="font-weight: 600; font-size: 0.85rem; margin-bottom: 5px;">🤖 AI Analysis Preview</p>
          <p id="ai-preview-text" style="font-size: 0.8rem; color: var(--text-gray);"></p>
        </div>
        
        <input type="hidden" id="latitude" />
        <input type="hidden" id="longitude" />
        <input type="hidden" id="before_image" />

        <button type="submit" class="submit-btn" id="btn-submit" disabled>Submit Report</button>
      </form>
    </div>

    <script>
      const user = localStorage.getItem("user") || sessionStorage.getItem("user");
      if (!user) {
        alert("You must be logged in to report missions.");
        window.location.href = "auth.html";
      }

      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const photoResult = document.getElementById('photo-result');
      const overlayInfo = document.getElementById('overlay-info');
      
      const btnStartCam = document.getElementById('btn-start-cam');
      const btnCapture = document.getElementById('btn-capture');
      const btnRetake = document.getElementById('btn-retake');
      const btnSubmit = document.getElementById('btn-submit');
      const form = document.getElementById('report-form');
      
      let stream = null;
      let globalBase64 = null;
      let gpsLat = null;
      let gpsLng = null;
      let gpsAddress = 'Searching...';
      let fullAddressStr = '';

      // 1. Get GPS
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            gpsLat = pos.coords.latitude;
            gpsLng = pos.coords.longitude;
            document.getElementById('latitude').value = gpsLat;
            document.getElementById('longitude').value = gpsLng;
            
            // precise reverse geocode
            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${gpsLat}&lon=${gpsLng}`);
              const data = await res.json();
              if (data && data.address) {
                const a = data.address;
                const parts = [a.road, a.neighbourhood || a.suburb, a.city_district, a.city || a.town || a.village].filter(Boolean);
                // remove duplicates and pick up to 3 parts
                gpsAddress = [...new Set(parts)].slice(0, 3).join(', ');
                fullAddressStr = data.display_name;
                if (!gpsAddress) gpsAddress = data.display_name;
              } else {
                gpsAddress = data.display_name || `Lat: ${gpsLat.toFixed(4)}, Lng: ${gpsLng.toFixed(4)}`;
                fullAddressStr = gpsAddress;
              }
            } catch (e) {
              gpsAddress = `Lat: ${gpsLat.toFixed(4)}, Lng: ${gpsLng.toFixed(4)}`;
              fullAddressStr = gpsAddress;
            }
            document.getElementById('location_text').value = gpsAddress;
            updateOverlay();
          },
          (err) => {
            gpsAddress = "GPS Permission Denied / Unavailable";
            document.getElementById('location_text').value = gpsAddress;
            updateOverlay();
          }
        );
      } else {
        gpsAddress = "Geolocation not supported";
        document.getElementById('location_text').value = gpsAddress;
        updateOverlay();
      }

      function updateOverlay() {
        const d = new Date().toLocaleString();
        overlayInfo.innerText = `📍 ${gpsAddress}\n🕒 ${d}`;
      }
      setInterval(updateOverlay, 1000);

      btnStartCam.addEventListener('click', async () => {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          video.srcObject = stream;
          video.style.display = 'block';
          photoResult.style.display = 'none';
          btnStartCam.style.display = 'none';
          btnCapture.style.display = 'inline-block';
          btnRetake.style.display = 'none';
          overlayInfo.style.display = 'block';
        } catch (err) {
          alert('Camera access denied or unavailable: ' + err.message);
        }
      });

      btnCapture.addEventListener('click', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        
        // Draw video
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Draw overlay permanently on canvas
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(10, canvas.height - 70, canvas.width - 20, 60);

        ctx.fillStyle = "white";
        ctx.font = "16px Arial";
        const d = new Date().toLocaleString();
        ctx.fillText(`📍 ${gpsAddress.substring(0, 60)}...`, 20, canvas.height - 40);
        ctx.fillText(`🕒 ${d}`, 20, canvas.height - 15);

        globalBase64 = canvas.toDataURL('image/png');
        document.getElementById('before_image').value = globalBase64;
        
        photoResult.src = globalBase64;
        photoResult.style.display = 'block';
        video.style.display = 'none';
        
        btnCapture.style.display = 'none';
        btnRetake.style.display = 'inline-block';
        btnSubmit.disabled = false;
        overlayInfo.style.display = 'none'; // hide live overlay, we have it painted

        // stop tracks
        if (stream) stream.getTracks().forEach(track => track.stop());
      });

      btnRetake.addEventListener('click', () => {
        btnStartCam.click(); // restart process
        btnSubmit.disabled = true;
      });

      const API_URL = window.location.origin;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const payload = {
          creator_email: user,
          type: document.getElementById('type').value,
          description: document.getElementById('description').value,
          equipment_needed: document.getElementById('equipment_needed').value,
          full_address: fullAddressStr,
          location_text: document.getElementById('location_text').value,
          latitude: parseFloat(document.getElementById('latitude').value || 0),
          longitude: parseFloat(document.getElementById('longitude').value || 0),
          before_image: document.getElementById('before_image').value,
          people_needed: parseInt(document.getElementById('people_needed').value) || 2
        };

        btnSubmit.disabled = true;
        btnSubmit.innerText = "Uploading...";

        try {
          const res = await fetch(`${API_URL}/missions/report`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if(res.ok) {
            alert("Mission reported successfully!");
            window.location.href = "missions.html";
          } else {
            alert(data.error);
            btnSubmit.disabled = false;
            btnSubmit.innerText = "Submit Report";
          }
        } catch (err) {
          alert('Network error');
          btnSubmit.disabled = false;
          btnSubmit.innerText = "Submit Report";
        }
      });
    </script>
    <script src="js/nav.js"></script>
  </body>
</html>
