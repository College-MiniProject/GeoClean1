<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set New Password | GeoClean</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth-body">
    <div class="auth-container">
      <div class="glow-blob blob-1"></div>

      <div class="auth-card">
        <form id="resetForm" class="auth-form">
          <h2>New Password 🔑</h2>
          <p class="auth-subtitle">Create a new, strong password.</p>

          <div class="input-group">
            <label>New Password</label>
            <div class="password-wrapper">
              <input id="newPassword" type="password" placeholder="••••••••" required />
              <span class="eye-icon" onclick="togglePassword('newPassword', this)">👁️</span>
            </div>
          </div>

          <div class="input-group">
            <label>Confirm Password</label>
            <div class="password-wrapper">
              <input id="confirmPassword" type="password" placeholder="••••••••" required />
              <span class="eye-icon" onclick="togglePassword('confirmPassword', this)">👁️</span>
            </div>
            <small class="error-message" id="errorMsg"></small>
          </div>

          <button type="submit" class="btn-primary full-width" id="submitBtn">Save New Password</button>
        </form>
      </div>
    </div>

    <script>
      const API_URL = window.location.origin;

      function togglePassword(inputId, iconEl) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
          iconEl.textContent = "🙈"; 
        } else {
          input.type = "password";
          iconEl.textContent = "👁️";
        }
      }

      function checkPasswords() {
        const p1 = document.getElementById("newPassword").value;
        const p2 = document.getElementById("confirmPassword").value;
        const err = document.getElementById("errorMsg");
        const cp = document.getElementById("confirmPassword");
        
        if (p2 === "") {
          err.textContent = ""; cp.classList.remove("error");
        } else if (p1 !== p2) {
          err.textContent = "Passwords do not match"; cp.classList.add("error");
        } else {
          err.textContent = ""; cp.classList.remove("error");
        }
      }

      document.getElementById("newPassword").addEventListener("input", checkPasswords);
      document.getElementById("confirmPassword").addEventListener("input", checkPasswords);

      document.getElementById("resetForm").addEventListener("submit", function (e) {
        e.preventDefault();
        
        const p1 = document.getElementById("newPassword").value;
        const p2 = document.getElementById("confirmPassword").value;
        if (p1 !== p2) {
          alert("Passwords do not match.");
          return;
        }

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
          alert("Invalid reset link. No token found in URL.");
          return;
        }

        const btn = document.getElementById("submitBtn");
        btn.textContent = "Saving..."; btn.disabled = true;

        fetch(`${API_URL}/api/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token, new_password: p1 })
        })
        .then((res) => res.json())
        .then((data) => {
          if (data.message) {
            alert(data.message);
            window.location.href = "auth.html";
          } else {
            alert(data.error);
            btn.textContent = "Save New Password"; btn.disabled = false;
          }
        })
        .catch((err) => {
          alert("Network error.");
          btn.textContent = "Save New Password"; btn.disabled = false;
        });
      });
    </script>
  </body>
</html>
