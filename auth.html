<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join GeoClean | Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <!-- <link rel="stylesheet" href="style.css" /> -->
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth-body">
    <nav class="navbar">
      <div class="nav-left">
        <button class="hamburger-menu">☰</button>
        <div class="logo">
          <a href="index.html" style="text-decoration: none; color: white">
            Geo<span class="highlight">Clean</span> 🌍
          </a>
        </div>
      </div>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="missions.html">Missions</a>
        <a href="Dashboard.html">Dashboard</a>
      </div>

      <div id="auth-container">
         <!-- Injected by js/nav.js -->
      </div>
    </nav>

    <div class="auth-container">
      <div class="glow-blob blob-1"></div>
      <div class="glow-blob blob-2"></div>

      <div class="auth-card">
        <form id="loginForm" class="auth-form">
          <h2 id="login-heading">Welcome Back 👋</h2>
          <p class="auth-subtitle" id="login-subtitle">Continue your mission to clean the city.</p>

          <!-- Role Selector -->
          <div style="display: flex; gap: 0; margin-bottom: 20px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);">
            <button type="button" id="role-user-btn" onclick="setLoginRole('user')" style="flex:1; padding: 10px; border: none; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: 0.2s; background: var(--primary-green); color: #000;">
              👤 User
            </button>
            <button type="button" id="role-admin-btn" onclick="setLoginRole('admin')" style="flex:1; padding: 10px; border: none; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: 0.2s; background: rgba(255,255,255,0.05); color: var(--text-gray);">
              🛡️ Admin
            </button>
          </div>

          <div class="input-group">
            <label id="login-label">Email or Username</label>
            <input
              id="loginEmail"
              type="text"
              placeholder="student@college.edu or Full Name"
              required
            />
          </div>

          <div class="input-group">
            <label>Password</label>
            <div class="password-wrapper">
              <input
                id="loginPassword"
                type="password"
                placeholder="••••••••"
                required
              />
              <span class="eye-icon" onclick="togglePassword('loginPassword', this)">👁️</span>
            </div>
          </div>

          <div class="form-actions" id="login-remember-row">
            <label class="checkbox-container">
              <input type="checkbox" id="rememberMe" checked /> Remember me
            </label>
            <a href="forgot-password.html" class="forgot-pass" id="forgot-pass-link">Forgot Password?</a>
          </div>

          <button type="submit" class="btn-primary full-width" id="login-submit-btn">
            Login to GeoClean
          </button>

          <p class="switch-text" id="login-register-link">
            New here? <a href="#" onclick="toggleForms()">Create an Account</a>
          </p>
        </form>

        <form id="registerForm" class="auth-form hidden">
          <h2>Join the Force 🚀</h2>
          <p class="auth-subtitle">Start earning points and rewards today.</p>

          <div class="input-group">
            <label>Full Name</label>
            <input
              id="fullName"
              type="text"
              placeholder="e.g. Aditya Kumar"
              required
            />
          </div>

          <div class="input-group">
            <label>College Email</label>
            <input
              id="email"
              type="email"
              placeholder="student@college.edu"
              required
            />
          </div>

          <div class="input-group">
            <label>Password</label>
            <div class="password-wrapper">
              <input
                id="password"
                type="password"
                placeholder="Create a strong password"
                required
              />
              <span class="eye-icon" onclick="togglePassword('password', this)">👁️</span>
            </div>
          </div>

          <div class="input-group">
            <label>Confirm Password</label>
            <div class="password-wrapper">
              <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm your password"
                required
              />
              <span class="eye-icon" onclick="togglePassword('confirmPassword', this)">👁️</span>
            </div>
            <small class="error-message"></small>
          </div>

          <div class="input-group">
            <label>Select Department</label>
            <select id="department" required>
              <option value="" disabled selected>Choose your dept...</option>
              <option value="cs">Computer Science</option>
              <option value="it">Information Tech</option>
              <option value="mech">Mechanical</option>
              <option value="civil">Civil</option>
            </select>
          </div>

          <button type="submit" class="btn-primary full-width">
            Create Account
          </button>

          <p class="switch-text">
            Already have an account?
            <a href="#" onclick="toggleForms()">Login here</a>
          </p>
        </form>
      </div>
    </div>

    <script>
      // const password = document.getElementById("password");
      // const confirmPassword = document.getElementById("confirmPassword");

      // confirmPassword.addEventListener("input", function () {
      //   if (password.value != confirmPassword.value) {
      //     confirmPassword.classList.add("error");
      //   } else {
      //     confirmPassword.classList.remove("error");
      //   }
      // });

      // document.addEventListener("DOMContentLoaded", function () {
      //   const password = document.getElementById("password");
      //   const confirmPassword = document.getElementById("confirmPassword");

      //   confirmPassword.addEventListener("input", function () {
      //     if (confirmPassword.value === "") {
      //       confirmPassword.classList.remove("error");
      //     } else if (password.value !== confirmPassword.value) {
      //       confirmPassword.classList.add("error");
      //       console.log("error");
      //     } else {
      //       confirmPassword.classList.remove("error");
      //     }
      //   });
      // });

      function checkPasswords() {
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const errorMessage = document.querySelector(".error-message");
        if (confirmPassword.value === "") {
          confirmPassword.classList.remove("error");
          errorMessage.textContent = "";
        } else if (password.value !== confirmPassword.value) {
          confirmPassword.classList.add("error");
          errorMessage.textContent = "Passwords do not match";
        } else {
          confirmPassword.classList.remove("error");
          errorMessage.textContent = "";
        }
      }
      const passwordEl = document.getElementById("password");
      const confirmPasswordEl = document.getElementById("confirmPassword");
      if (passwordEl && confirmPasswordEl) {
        passwordEl.addEventListener("input", checkPasswords);
        confirmPasswordEl.addEventListener("input", checkPasswords);
      }

      function toggleForms() {
        const login = document.getElementById("loginForm");
        const register = document.getElementById("registerForm");

        if (login.classList.contains("hidden")) {
          login.classList.remove("hidden");
          register.classList.add("hidden");
        } else {
          login.classList.add("hidden");
          register.classList.remove("hidden");
        }
      }

      const API_URL = window.location.origin;
      
      const registerForm = document.getElementById("registerForm");
      registerForm.addEventListener("submit", function (e) {
        e.preventDefault();

        const fullName = document.getElementById("fullName").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const department = document.getElementById("department").value;

        fetch(`${API_URL}/register`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            full_name: fullName,
            email: email,
            password: password,
            department: department,
          }),
        })
          .then((res) => res.json())
          .then((data) => {
            console.log(data);
            alert(data.message || data.error);
          })
          .catch((err) => {
            alert("Registration Failed: Network error. " + err.message);
          });
      });

      const loginForm = document.getElementById("loginForm");
      let loginRole = 'user'; // default

      function setLoginRole(role) {
        loginRole = role;
        const userBtn = document.getElementById('role-user-btn');
        const adminBtn = document.getElementById('role-admin-btn');
        const heading = document.getElementById('login-heading');
        const subtitle = document.getElementById('login-subtitle');
        const label = document.getElementById('login-label');
        const input = document.getElementById('loginEmail');
        const submitBtn = document.getElementById('login-submit-btn');
        const registerLink = document.getElementById('login-register-link');
        const rememberRow = document.getElementById('login-remember-row');

        if (role === 'admin') {
          userBtn.style.background = 'rgba(255,255,255,0.05)';
          userBtn.style.color = 'var(--text-gray)';
          adminBtn.style.background = '#f59e0b';
          adminBtn.style.color = '#000';
          heading.textContent = 'Admin Access 🛡️';
          subtitle.textContent = 'Manage missions, users, and system settings.';
          label.textContent = 'Admin Username';
          input.placeholder = 'admin';
          submitBtn.textContent = 'Login as Admin';
          submitBtn.style.background = '#f59e0b';
          registerLink.style.display = 'none';
          rememberRow.style.display = 'none';
          document.getElementById('forgot-pass-link').style.display = 'none';
        } else {
          userBtn.style.background = 'var(--primary-green)';
          userBtn.style.color = '#000';
          adminBtn.style.background = 'rgba(255,255,255,0.05)';
          adminBtn.style.color = 'var(--text-gray)';
          heading.textContent = 'Welcome Back 👋';
          subtitle.textContent = 'Continue your mission to clean the city.';
          label.textContent = 'Email or Username';
          input.placeholder = 'student@college.edu or Full Name';
          submitBtn.textContent = 'Login to GeoClean';
          submitBtn.style.background = '';
          registerLink.style.display = '';
          rememberRow.style.display = '';
          document.getElementById('forgot-pass-link').style.display = 'block';
        }
      }

      loginForm.addEventListener("submit", function (e) {
        e.preventDefault();

        const identifier = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        if (loginRole === 'admin') {
          // Admin login → /admin/login
          fetch(`${API_URL}/admin/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: identifier, password: password }),
          })
            .then((res) => res.json())
            .then((data) => {
              if (data.message === "Admin login successful") {
                sessionStorage.setItem("admin", JSON.stringify(data.admin));
                window.location.href = "admin.html";
              } else {
                alert(data.error || "Admin login failed");
              }
            })
            .catch((err) => {
              alert("Login Failed: Server unreachable. " + err.message);
            });
        } else {
          // User login → /login
          fetch(`${API_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: identifier, password: password }),
          })
            .then((res) => res.json())
            .then((data) => {
              if (data.message === "Login successful") {
                const userEmail = data.user.email;
                const remMe = document.getElementById("rememberMe");
                if (remMe && remMe.checked) {
                  localStorage.setItem("user", userEmail);
                } else {
                  sessionStorage.setItem("user", userEmail);
                  localStorage.removeItem("user");
                }
                window.location.href = "Dashboard.html";
              } else {
                alert(data.error);
              }
            })
            .catch((err) => {
              alert("Login Failed: Server unreachable. " + err.message);
            });
        }
      });

      // Show/Hide Password Toggle Function
      function togglePassword(inputId, iconEl) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
          iconEl.textContent = "🙈"; 
        } else {
          input.type = "password";
          iconEl.textContent = "👁️";
        }
      }

      // Auto-redirect if already logged in via Remember Me
      window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('user')) {
          window.location.href = 'Dashboard.html';
        }
      });
    </script>
    <script src="js/nav.js"></script>
  </body>
</html>
