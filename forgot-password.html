<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | GeoClean</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth-body">
    <nav class="navbar">
      <div class="nav-left">
        <div class="logo">
          <a href="index.html" style="text-decoration: none; color: white">Geo<span class="highlight">Clean</span> 🌍</a>
        </div>
      </div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="auth.html">Login</a>
      </div>
    </nav>

    <div class="auth-container">
      <div class="glow-blob blob-1"></div>
      <div class="glow-blob blob-2"></div>

      <div class="auth-card">
        <form id="forgotForm" class="auth-form">
          <h2>Reset Password 🔒</h2>
          <p class="auth-subtitle">Enter your college email to receive a reset link.</p>

          <div class="input-group">
            <label>Email Address</label>
            <input id="email" type="email" placeholder="student@college.edu" required />
          </div>

          <button type="submit" class="btn-primary full-width" id="submitBtn">Send Reset Link</button>

          <p class="switch-text">
            Remembered it? <a href="auth.html">Back to Login</a>
          </p>
        </form>
      </div>
    </div>

    <script>
      const API_URL = window.location.origin;

      document.getElementById("forgotForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const btn = document.getElementById("submitBtn");
        
        btn.textContent = "Sending...";
        btn.disabled = true;

        fetch(`${API_URL}/api/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email })
        })
        .then((res) => res.json())
        .then((data) => {
          alert(data.message || data.error);
          btn.textContent = "Send Reset Link";
          btn.disabled = false;
        })
        .catch((err) => {
          alert("Network error. Could not send request.");
          btn.textContent = "Send Reset Link";
          btn.disabled = false;
        });
      });
    </script>
  </body>
</html>
